<title>매장 판매 코칭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--surface-2:#EDF0F4;--line:#DCE1E8;
  --ink:#15202B;--muted:#5B6875;--accent:#2E54D6;--accent-ink:#FFFFFF;--accent-soft:#E3E9FB;
  --good:#16804F;--good-soft:#DFF2E8;--warn:#A86400;--warn-soft:#FBEED6;--bad:#C23636;--bad-soft:#FBE4E4;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 16px rgba(21,32,43,.06);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1319;--surface:#161D26;--surface-2:#1D2631;--line:#2A3542;
  --ink:#E6ECF2;--muted:#94A1AF;--accent:#7D98F4;--accent-ink:#0E1319;--accent-soft:#1F2A4A;
  --good:#52C68F;--good-soft:#16301F;--warn:#E9A640;--warn-soft:#382A12;--bad:#F07878;--bad-soft:#3A1D20;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1319;--surface:#161D26;--surface-2:#1D2631;--line:#2A3542;
  --ink:#E6ECF2;--muted:#94A1AF;--accent:#7D98F4;--accent-ink:#0E1319;--accent-soft:#1F2A4A;
  --good:#52C68F;--good-soft:#16301F;--warn:#E9A640;--warn-soft:#382A12;--bad:#F07878;--bad-soft:#3A1D20;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* preview strip */
.strip{background:var(--ink);color:var(--bg);padding:8px 16px;font-size:12.5px}
.strip-in{max-width:600px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.strip b{font-weight:600;letter-spacing:.02em}
.roles{display:flex;gap:4px}
.roles button{border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);border-radius:999px;padding:3px 11px;font-size:12.5px}
.roles button[aria-pressed="true"]{background:var(--bg);color:var(--ink);border-color:var(--bg)}

.shell{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.topbar h1{font-size:19px;font-weight:700;margin:0;flex:1;text-wrap:balance}
.who{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.back{border:0;background:var(--surface-2);border-radius:10px;width:36px;height:36px;display:grid;place-items:center}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs .dot{position:absolute;top:5px;left:calc(50% + 8px);background:var(--bad);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px;font-family:var(--mono)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.stack{display:flex;flex-direction:column;gap:14px}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:10px 0 -4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{margin:0 0 10px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.2;margin-top:2px}
.tile .v small{font-size:13px;color:var(--muted);font-family:var(--sans)}
.delta{font-size:12.5px;font-family:var(--mono)}
.up{color:var(--good)}.down{color:var(--bad)}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-family:var(--mono);font-size:18px;min-width:40px;text-align:right}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.step{font-size:12.5px;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.step.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.step.done{border-color:var(--accent)}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center;width:100%}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice .main{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop label{cursor:pointer}
.hint{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}

.stages{display:flex;flex-direction:column;gap:10px}
.stage{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:14px}
.stage .ic{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.stage.done .ic{background:var(--good);border-color:var(--good);color:#fff}
.stage.run .ic{border-color:var(--accent);border-top-color:transparent;animation:spin 0.9s linear infinite}
.stage.wait{color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.sizes{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.sizes .v{font-family:var(--mono);font-size:22px}
.sizes .k{font-size:12px;color:var(--muted)}

.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .lbl{fill:var(--ink);font-size:12px}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:8px;border-radius:3px;background:var(--accent);display:inline-block}
.sw.dot{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.sw.low{background:var(--warn)}

.check{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0;padding-top:4px}
.check .req{font-weight:600;font-size:14.5px}
.check .ev{grid-column:2;font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.check .ev .ts{font-family:var(--mono);font-size:12px;color:var(--accent)}
.check .type{grid-column:2;font-size:12px;color:var(--muted)}

.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-h{width:100%;border:0;background:none;display:flex;align-items:center;gap:10px;padding:12px 0;text-align:left}
.item-h .n{flex:1;font-weight:600}
.item-b{padding:0 0 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.item-b p{margin:0}
.lab{font-size:12px;font-weight:600;letter-spacing:.03em;display:block;margin-bottom:2px}
.lab.b{color:var(--accent)}.lab.m{color:var(--warn)}
.scorebox{width:64px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface-2);font-family:var(--mono);text-align:right}
.tasks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.good{background:var(--good-soft);color:var(--good)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px}

/* login */
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:32px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--mono)}
.login h1{font-size:28px;margin:0;line-height:1.25;text-wrap:balance}
.login p{margin:0;color:var(--muted)}
.rolepick{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){.stage.run .ic{animation:none}.bar i{transition:none}}
textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-height:76px;resize:vertical}
.cmp{display:grid;grid-template-columns:1fr 44px 70px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.cmp:first-of-type{border-top:0}
.cmp.h{font-size:12px;color:var(--muted);font-weight:600;padding-top:0}
.cmp .ai{font-family:var(--mono);text-align:center;color:var(--muted)}
.cmp .gap{font-size:11.5px;color:var(--warn);font-weight:600}
.attempt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.attempt:first-child{border-top:0}
.attempt[aria-pressed="true"]{background:var(--accent-soft)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.attempt[aria-pressed="true"] .radio{border-color:var(--accent)}
.attempt[aria-pressed="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sw.ai{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.linechart text{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.linechart .grid{stroke:var(--line)}
</style>

<div class="strip"><div class="strip-in"><b>미리보기 · 샘플 데이터</b><div class="roles" id="roles"></div></div></div>
<div class="shell" id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="tabs-in" id="tabs-in"></div></nav>

<script>
const ICON={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 up:'<path d="M12 16V4M6 10l6-6 6 6M4 20h16"/>',
 inbox:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.6 3.5 5.2"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6"/>',

 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 file:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/>',
 chev:'<path d="M6 9l6 6 6-6"/>'
};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24" ${s?`style="width:${s}px;height:${s}px"`:''} aria-hidden="true">${ICON[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 샘플 데이터 ---------- */
const CRIT=['제품특징','제품사용설명','묶음판매','친절','자신감','고객소통','고객 니즈 파악','개인화된 제품 추천','재치 있는 멘트','클로징 능력'];
const TEAM_AVG=[7.4,6.9,5.6,8.4,6.9,7.6,6.4,5.8,6.6,5.4];
const BASIS={
 '제품특징':['“72시간 보습이 임상으로 확인된 제품이에요”라고 수치를 들어 설명함','세라마이드 성분 언급은 있었으나 3종 구성 설명은 빠짐'],
 '제품사용설명':['세럼 다음 단계에 바르는 순서를 손등 시연과 함께 안내함','사용량(진주알 크기) 안내 없이 “적당히”라고 표현함'],
 '묶음판매':['고객이 세럼을 보던 시점에 1+1 행사를 연결하지 못함','행사 콜멘트의 세럼 연계 문구를 사용하지 않음'],
 '친절':['입장 인사부터 배웅까지 존댓말과 밝은 톤을 일관되게 유지함','고객이 망설일 때 재촉하지 않고 기다려 줌'],
 '자신감':['가격 질문에 머뭇거림 없이 행사가와 정상가를 바로 비교함','성분 질문에서 “잘 모르겠지만”으로 시작해 신뢰가 약해짐'],
 '고객소통':['고객 말을 끊지 않고 요약해 되물어 확인함(“건조함이 제일 고민이시죠?”)','전문 용어를 쉬운 말로 바꿔 설명함'],
 '고객 니즈 파악':['피부 타입은 물었으나 현재 사용 제품을 확인하지 않음','“저녁에만 바르시나요?” 등 사용 습관 질문이 부족함'],
 '개인화된 제품 추천':['건성 피부라는 답을 듣고도 일반 설명을 반복함','고객 상황에 맞춘 대안 제품 제안이 없음'],
 '재치 있는 멘트':['“1+1이라 한 통은 사무실에 두시면 딱이에요”로 분위기를 풀어 줌','가벼운 농담이 행사 설명과 자연스럽게 이어짐'],
 '클로징 능력':['“생각해 볼게요”에 대응 멘트 없이 대화가 끝남','행사 마감일과 샘플 키트 혜택을 클로징에 쓰지 않음']
};
const IMPROVE={
 '제품특징':'세라마이드 3종(NP·AP·EOP)을 한 문장으로 묶어 말하는 연습을 해 보세요.',
 '제품사용설명':'사용량을 “진주알 한 개 크기”처럼 구체적으로 안내해 주세요.',
 '묶음판매':'세럼을 보는 순간이 기회입니다. “세럼과 함께 쓰시면 흡수가 더 좋아요”를 바로 붙여 보세요.',
 '친절':'지금처럼 유지하세요. 배웅 멘트에 다음 방문 혜택을 한 줄 더하면 좋습니다.',
 '자신감':'자주 나오는 성분 질문 5개는 답을 외워 두면 머뭇거림이 줄어듭니다.',
 '고객소통':'확인 질문 뒤에 고객 답을 다시 한번 짧게 요약해 주면 더 좋습니다.',
 '고객 니즈 파악':'“지금 쓰시는 크림은 어떤 점이 아쉬우세요?”를 첫 질문으로 넣어 보세요.',
 '개인화된 제품 추천':'고객이 말한 피부 고민을 추천 이유에 그대로 넣어 말해 주세요.',
 '재치 있는 멘트':'좋습니다. 같은 톤으로 클로징까지 이어 가면 효과가 커집니다.',
 '클로징 능력':'“이번 주 일요일까지 1+1이고, 오늘은 샘플 키트도 드려요”로 마무리를 제안하세요.'

function hbar(rows,opt={}){
 const W=340,L=112,R=16,rowH=26,top=6,H=top+rows.length*rowH+22,sx=v=>L+(W-L-R)*v/10;
 let g='';
 for(let t=0;t<=10;t+=2)g+=`<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${top}" y2="${H-18}"/><text x="${sx(t)}" y="${H-4}" text-anchor="middle">${t}</text>`;
 const low=opt.lowest!=null?opt.lowest:-1;
 rows.forEach((r,i)=>{const y=top+i*rowH;
  g+=`<text class="lbl" x="${L-8}" y="${y+16}" text-anchor="end">${esc(r.name)}</text>`;
  g+=`<rect x="${L}" y="${y+6}" width="${Math.max(2,sx(r.v)-L)}" height="13" rx="4" fill="${i===low?'var(--warn)':'var(--accent)'}"/>`;
  if(r.dot!=null)g+=`<circle cx="${sx(r.dot)}" cy="${y+12.5}" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;
 });
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'항목별 점수')}">${g}</svg>`;
}
function lineChart(pts,opt={}){ // pts:[{x:'1회',v,c}]  v=점수(0-10), c=준수율(0-100)
 const W=340,H=150,L=28,R=12,T=10,B=26,n=pts.length;const sx=i=>L+(n===1?0:(W-L-R)*i/(n-1));const sy=v=>T+(H-T-B)*(1-v/10);
 let g='';for(let t=0;t<=10;t+=5)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${L-6}" y="${sy(t)+4}" text-anchor="end">${t}</text>`;
 const line=(key,col,dash)=>`<polyline points="${pts.map((p,i)=>`${sx(i)},${sy(key==='c'?p.c/10:p.v)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2" ${dash?'stroke-dasharray="4 4"':''}/>`+pts.map((p,i)=>`<circle cx="${sx(i)}" cy="${sy(key==='c'?p.c/10:p.v)}" r="${p.sel&&key==='v'?5.5:3.5}" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`).join('');
 g+=line('c','var(--good)',true)+line('v','var(--accent)');
 pts.forEach((p,i)=>g+=`<text x="${sx(i)}" y="${H-6}" text-anchor="middle">${p.x}</text>`);
 return `<svg class="linechart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="회차별 점수 추이">${g}</svg>`;

function parseSheet(file){
 const rd=new FileReader();
 rd.onload=()=>{try{
  const buf=new Uint8Array(rd.result);let wb;
  if(/\.csv$/i.test(file.name)){let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('euc-kr').decode(buf)}wb=XLSX.read(txt.replace(/^\uFEFF/,''),{type:'string'})}
  else wb=XLSX.read(buf,{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(sh,{header:1,defval:''});
  const h=aoa.findIndex(r=>r.some(c=>String(c).trim()==='이름')&&r.some(c=>String(c).trim()==='사번'));
  if(h<0){S.bulk={error:'첫 줄에서 ‘이름’, ‘사번’ 제목을 찾지 못했어요. 양식의 제목 줄을 그대로 두고 아래에 입력해 주세요.'};return render()}
  const head=aoa[h].map(c=>String(c).trim());const col=k=>head.findIndex(c=>c.startsWith(k));
  const idx=[col('이름'),col('사번'),col('매장'),col('담당'),col('초기')];
  const raw=aoa.slice(h+1).filter(r=>r.some(c=>String(c).trim())).map(r=>idx.map(i=>i<0?'':r[i]));
  if(!raw.length){S.bulk={error:'제목 줄 아래에 사원 정보가 없어요.'};return render()}
  loadRows(raw,file.name);
 }catch(e){S.bulk={error:'파일을 읽지 못했어요. 엑셀(.xlsx, .xls) 또는 CSV 파일인지 확인해 주세요.'};render()}};
 rd.readAsArrayBuffer(file);
}

     <div class="meta" style="justify-content:space-between;margin-top:4px"><span class="num">${fmtSec(pos)}</span><span class="num">${b.dur}</span></div></div></div>
   <div class="stack" style="gap:6px;margin-top:10px">${b.ch.map((c,i)=>{const act=on&&pos>=toSec(c[0])&&(i===b.ch.length-1||pos<toSec(b.ch[i+1][0]));
    return `<button class="choice" style="padding:9px 12px" aria-pressed="${act}" data-act="seek:${b.id}|${c[0]}"><span class="num" style="color:var(--accent);font-size:13px">${c[0]}</span><div class="main"><div style="font-weight:600;font-size:14px">${c[1]}</div><div class="hint" style="white-space:normal">${esc(c[2])}</div></div></button>`}).join('')}</div>
   <div class="btns" style="margin-top:10px"><button class="btn ghost" data-act="like:${b.id}">${S.liked&&S.liked[b.id]?'♥':'♡'} 도움이 됐어요 ${b.likes}</button><span class="hint" style="align-self:center">재생 ${b.plays}회</span></div>
   ${S.role==='admin'?'<button class="btn ghost block" style="margin-top:6px">게시판에서 내리기</button>':''}
  </article>`}).join('')}
 </div>`;
}
const toSec=t=>{const [m,s]=t.split(':').map(Number);return m*60+s};
const fmtSec=x=>`${String(Math.floor(x/60)).padStart(2,'0')}:${String(Math.floor(x%60)).padStart(2,'0')}`;

/* 평가 상세: 역할/상태에 따라 AI 결과 + 매니저 평가 */
function vEval(){
 const e=EVALS.find(x=>x.id===S.view.id);const emp=E(e.emp),pr=P(e.p);
 const isMgr=S.role!=='employee';const t=aiTotal(e),cr=compRate(e);const m=mgrTotal(e);
 const counts={m:0,p:0,x:0,v:0};e.comp.forEach(c=>counts[c.st]++);
 const prevAttempt=EVALS.filter(x=>x.emp===e.emp&&x.p===e.p&&x.kind==='practice'&&x.n===e.n-1)[0];
 const canReview=isMgr&&(e.status==='submitted'||e.status==='reviewing');
 const showMgr=e.mgr&&(isMgr||e.status==='completed');
 const low=e.items.reduce((a,b,i,arr)=>b.score<arr[a].score?i:a,0);
 let top=`<div><div style="font-size:22px;font-weight:700">${isMgr?emp.name:`${e.kind==='practice'?e.n+'회차 연습':'평가'}`}</div>
   <div class="meta"><span>${esc(pr.name)}</span><span>${e.date}</span><span>대화 ${e.dur}</span></div>
   <div class="chips" style="margin-top:6px">${statusPill(e.status)}${isMgr?kindPill(e):''}</div></div>`;
 if(S.toast)top+=`<div class="banner good">${S.toast}</div>`;
 if(!isMgr&&e.status==='practice')top+=`<div class="banner info">연습 결과는 나만 볼 수 있어요. 가장 잘한 회차를 골라 ‘연습 기록’에서 매니저에게 제출하세요.</div>`;
 if(e.note&&(isMgr||e.status!=='practice'))top+=`<div class="panel"><span class="lab b">사원 메모</span>${esc(e.note)}</div>`;
 const tiles=`<div class="tiles">
   ${showMgr?`<div class="tile"><div class="k">매니저 평가</div><div class="v">${m.toFixed(1)}<small> / 10</small></div><span class="hint">AI ${t.toFixed(1)}</span></div>`
     :`<div class="tile"><div class="k">AI 종합 점수</div><div class="v">${t.toFixed(1)}<small> / 10</small></div>${prevAttempt?delta(t,aiTotal(prevAttempt))+' <span class="hint">이전 회차 대비</span>':''}</div>`}
   <div class="tile"><div class="k">교육자료 준수율</div><div class="v">${cr}<small> %</small></div><span class="hint">충족 ${counts.m} · 부분 ${counts.p} · 누락 ${counts.x}${counts.v?` · 위반 ${counts.v}`:''}</span></div></div>`;
 const mgrPanel=showMgr?`<div class="panel"><h3>매니저 평가 <span class="hint" style="font-weight:400">· 정유진 · ${e.mgr.date}</span></h3>
   <p style="margin:0 0 10px">${esc(e.mgr.comment)}</p>
   <span class="lab b">코칭 과제</span><ol class="tasks">${e.mgr.tasks.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
   <div class="panel"><h3>항목별 점수: 매니저 vs AI</h3>
   ${hbar(e.items.map((it,i)=>({name:it.name,v:e.mgr.s[i],dot:it.score})),{label:'매니저 점수와 AI 점수'})}
   <div class="legend"><span><i class="sw"></i>매니저 점수</span><span><i class="sw ai"></i>AI 점수</span></div></div>`:'';
 const reviewPanel=canReview?vReviewForm(e):'';
 const compPanel=`<div class="panel"><h3>교육자료 준수 체크 <span class="hint" style="font-weight:400">· AI</span></h3>
   <div class="hint" style="margin:-6px 0 8px">기준: ${pr.materials.map(esc).join(', ')}</div>
   ${e.comp.map(c=>`<div class="check"><div>${c.type==='금지 표현'&&c.st==='m'?'<span class="pill p-good">위반 없음</span>':compPill(c.st)}</div>
     <div class="req">${esc(c.req)}</div><div class="type">${c.type}</div>
     <div class="ev"><span class="ts">${c.ev[0]}</span> ${esc(c.ev[1])}</div></div>`).join('')}</div>`;
 const aiChart=showMgr?'':`<div class="panel"><h3>항목별 AI 점수</h3>
   ${hbar(e.items.map(i=>({name:i.name,v:i.score,dot:i.avg})),{lowest:low})}
   <div class="legend"><span><i class="sw"></i>AI 점수</span><span><i class="sw dot"></i>팀 평균</span><span><i class="sw low"></i>가장 낮은 항목</span></div></div>`;
 const itemsPanel=`<div class="panel"><h3>항목별 근거와 개선점 <span class="hint" style="font-weight:400">· AI</span></h3>
   ${e.items.map((it,i)=>{const open=S.open[i];
    return `<div class="item"><button class="item-h" data-act="item:${i}" aria-expanded="${!!open}">
     <span class="n">${it.name}</span>${it.score>it.avg?'<span class="pill p-good">평균 이상</span>':'<span class="pill p-mute">평균 이하</span>'}
     <span class="score" style="font-size:16px">${it.score}</span>
     <span style="transform:rotate(${open?180:0}deg);display:inline-flex">${ic('chev',18)}</span></button>
     ${open?`<div class="item-b"><p><span class="lab b">평가 근거</span>${esc(it.basis)}. ${esc(it.basis2)}.</p><p><span class="lab m">개선할 점</span>${esc(it.improve)}</p></div>`:''}</div>`}).join('')}</div>`;
 const aiSummary=`<div class="panel"><h3>AI 총평과 연습 과제</h3><p style="margin:0 0 10px">${esc(e.summary)}</p><ol class="tasks">${e.tasks.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
 const src=`<div class="panel"><h3>원본</h3><div class="meta"><span>${esc(e.src)}</span><span>원본 ${e.orig} → 전송 ${e.out}</span></div>
   <button class="btn ghost" style="margin-top:10px">대화 녹취록 보기 (화자 구분)</button></div>`;
 const empSubmit=!isMgr&&e.status==='practice'?`<button class="btn block" data-act="hist:${e.p}">연습 기록에서 이 회차 제출하기</button>`:'';
 return `<div class="stack">${top}${tiles}${vShare(e)}${mgrPanel}${reviewPanel}${compPanel}${aiChart}${itemsPanel}${aiSummary}${src}${empSubmit}</div>`;
}

function vUpload(){
 const f=S.flow;const isEmp=S.role==='employee';
 const step=(n,l)=>`<div class="step ${f.step===n?'on':f.step>n?'done':''}">${n}. ${l}</div>`;
 let body='';
 if(f.phase==='pick'){
  if(f.step===1){
   body=`<div class="note">매니저가 올린 대화는 연습 단계 없이 바로 매니저 평가로 들어갑니다.</div><div class="sec-title">누구의 판매 대화인가요?</div><div class="grid2">${EMPS.map(m=>`<button class="choice" aria-pressed="${f.emp===m.id}" data-act="emp:${m.id}"><div class="avatar">${m.name[0]}</div><div class="main"><div class="t">${m.name}</div><div class="hint">사번 ${m.no}</div></div></button>`).join('')}</div>`;
  } else if(f.step===2){
   const cnt=id=>EVALS.filter(x=>x.emp===ME.employee.id&&x.p===id&&x.kind==='practice').length;
   body=`${isEmp?`<div class="note">횟수 제한 없이 연습할 수 있어요. 결과는 바로 나에게만 보입니다.</div>`:`<div class="note">사원: <b>${E(f.emp).name}</b> <button class="btn ghost" style="padding:2px 10px;font-size:12.5px;margin-left:6px" data-act="step:1">변경</button></div>`}
    <div class="sec-title">어떤 행사 품목을 판매했나요?</div>
    <div class="stack" style="gap:8px">${PRODUCTS.filter(p=>p.state==='live').map(p=>`<button class="choice" aria-pressed="${f.prod===p.id}" data-act="prod:${p.id}"><div class="main"><div class="t">${esc(p.name)}</div><div class="hint">${p.period} · 체크 항목 ${p.checklist.length}개${isEmp?` · 내 연습 ${cnt(p.id)}회`:''}</div></div>${prodState(p.state)}</button>`).join('')}</div>`;
  } else {
   const pr=P(f.prod);
   body=`<div class="note">${isEmp?'':`사원: <b>${E(f.emp).name}</b> · `}행사: <b>${esc(pr.name)}</b> <button class="btn ghost" style="padding:2px 10px;font-size:12.5px;margin-left:6px" data-act="step:2">변경</button></div>
    <div class="drop">${ic('up',28)}<div><b>녹음 또는 동영상 파일을 올려 주세요</b><div class="hint">m4a · mp3 · wav · mp4 · mov 등 · 원본 2GB까지</div></div>
     <label class="btn" for="file-in">파일 선택</label><input id="file-in" type="file" accept="audio/*,video/*" hidden>
     <div class="hint">또는 샘플로 체험해 보기</div>
     <div class="btns" style="width:100%"><button class="btn ghost" data-act="sample:video">매장 촬영 영상 812MB</button><button class="btn ghost" data-act="sample:audio">통화 녹음 68MB</button></div></div>
    <div class="note">동영상은 음성만 뽑아내고, 큰 파일은 휴대폰 안에서 음성 인식용으로 압축한 뒤 보냅니다. 원본은 기기에 그대로 남습니다. 서버 한도는 파일당 50MB입니다.</div>
    <div class="panel"><h3 style="font-size:14px">AI가 확인할 교육 내용 (${pr.checklist.length}개)</h3><div class="stack" style="gap:4px;font-size:13.5px">${pr.checklist.map(c=>`<div><span class="hint">${c[0]} · </span>${esc(c[1])}</div>`).join('')}</div></div>`;
  }
  const canNext=(f.step===1&&f.emp)||(f.step===2&&f.prod);
  if(f.step<3)body+=`<button class="btn block" data-act="next" ${canNext?'':'disabled'}>다음</button>`;
 } else body=vProcess();
 const steps=isEmp?`<div class="stepper" style="grid-template-columns:repeat(2,1fr)">${step(2,'행사 품목')}${step(3,'파일 업로드')}</div>`:`<div class="stepper">${step(1,'사원')}${step(2,'행사 품목')}${step(3,'파일 업로드')}</div>`;
 return `<div class="stack">${steps}${body}</div>`;
}

const STAGES_PRE={video:['동영상에서 음성 추출','음성 인식용으로 압축'],audio:['음성 인식용으로 압축']};
const STAGES_POST=['서버로 업로드','말소리를 텍스트로 변환 (화자 구분)','교육자료 기준으로 AI 평가'];
function vProcess(){
 const f=S.flow,file=f.file;const pre=STAGES_PRE[file.kind];
 const shown=f.phase==='send'||f.phase==='done'?pre.concat(STAGES_POST):pre;
 const fin=f.phase==='ready'||f.phase==='done';
 let out=`<div class="panel"><div class="meta" style="margin-bottom:10px"><span>${ic('file',16)} ${esc(file.name)}</span><span>${file.kind==='video'?'동영상':'음성'} · 원본 ${fmt(file.size)}</span></div>
  <div class="stages">${shown.map((s,i)=>{const done=fin||i<f.stage,run=!fin&&i===f.stage;return `<div class="stage ${done?'done':run?'run':'wait'}"><span class="ic">${done?'✓':''}</span><span>${s}</span><span class="num hint">${run?f.pct+'%':''}</span></div>`}).join('')}</div>
  ${f.phase==='compress'||f.phase==='send'?`<div class="bar" style="margin-top:12px"><i style="width:${f.pct}%"></i></div>`:''}</div>`;
 if(f.phase!=='compress')out+=`<div class="panel"><div class="sizes"><div><div class="k">원본</div><div class="v">${fmt(file.size)}</div></div><div class="hint">→</div><div><div class="k">보낼 음성</div><div class="v" style="color:var(--good)">${fmt(file.out)}</div></div></div>
   <div class="hint" style="text-align:center;margin-top:6px">${(100-file.out/file.size*100).toFixed(1)}% 줄었어요 · 모노 16kHz · 약 ${file.min}분</div></div>`;
 if(f.phase==='ready')out+=`<div class="panel"><h3 style="font-size:14px">미리듣기</h3>${wave()}<div class="hint">목소리가 잘 들리는지 확인한 뒤 보내 주세요.</div></div>
   <button class="btn block" data-act="send">업로드하고 AI 점검 시작</button>`;
 if(f.phase==='done')out+=S.role==='employee'
   ?`<div class="banner good">AI 점검이 끝났어요. 이번이 이 행사의 5회차 연습입니다.</div><button class="btn block" data-act="open:a5">결과 보기</button>`

 return out;
}
function wave(){let g='';for(let i=0;i<64;i++){const h=4+Math.abs(Math.sin(i*1.7)*Math.cos(i*.31))*26;g+=`<rect x="${i*5}" y="${20-h/2}" width="3" height="${h}" rx="1.5" fill="var(--accent)" opacity="${i<20?1:.35}"/>`}
 return `<div style="display:flex;gap:10px;align-items:center;margin:4px 0 8px"><button class="btn" style="width:40px;height:40px;padding:0;border-radius:50%" aria-label="재생">▶</button><svg viewBox="0 0 320 40" width="100%" height="40" aria-hidden="true">${g}</svg></div>`}
function fmt(b){const mb=b/1048576;return mb>=1024?(mb/1024).toFixed(2)+'GB':mb>=10?Math.round(mb)+'MB':mb.toFixed(1)+'MB'}

function startFile(name,size,kind){
 const min=kind==='video'?Math.max(1,Math.round(size/1048576/57)):Math.max(1,Math.round(size/1048576));
 S.flow.file={name,size,kind,min,out:Math.min(size,min*60*32000/8*1.02)};
 const f=S.flow;f.phase='compress';f.stage=0;f.pct=0;render();
 const pre=STAGES_PRE[kind].length;const speed=matchMedia('(prefers-reduced-motion:reduce)').matches?34:9;
 clearInterval(S.timer);
 S.timer=setInterval(()=>{f.pct=Math.min(100,f.pct+speed);if(f.pct>=100){f.stage++;f.pct=0;if(f.stage>=pre){clearInterval(S.timer);f.phase='ready';}}render()},180);
}

 if(a==='tpl'){S.tplNote=true;return render()}
 if(a==='mat'){S.matOpen=S.matOpen===v?null:v;return render()}
 if(a==='extract'){const p=P(v);if(!p.checklist.length){p.materials.push('레티놀 나이트크림 교육자료.pdf');p.checklist=[['필수 설명','순수 레티놀 0.1% 함량과 저녁 사용 안내'],['필수 설명','처음 2주는 격일 사용 권장'],['필수 콜멘트','“런칭 기념으로 앰플 미니를 드려요”'],['금지 표현','“주름이 없어진다” 등 치료 효과 표현']]}return render()}
});
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.dataset.sp){S.share=S.share||{};S.share.point=t.value;return}
 if(!S.draft)return;
 if(t.dataset.ms!=null){const i=+t.dataset.ms;const e=EVALS.find(x=>x.id===S.view.id);const v=Math.max(0,Math.min(10,Math.round(+t.value||0)));S.draft.s[i]=v;
  document.getElementById('ms-total').textContent=avg(S.draft.s).toFixed(1);const g=Math.abs(v-e.items[i].score);document.getElementById('gap-'+i).textContent=g>=2?'차이 '+g:''}
 if(t.dataset.mc)S.draft.comment=t.value;
 if(t.dataset.mt)S.draft.tasks=t.value;
});
document.addEventListener('change',ev=>{
 if(ev.target.dataset.ok){S.share=S.share||{};S.share.point=(document.getElementById('share-point')||{}).value||S.share.point;S.share[ev.target.dataset.ok]=ev.target.checked;return render()}
 if(ev.target.id==='bulk-in'){const f=ev.target.files[0];if(f)parseSheet(f);return}
 if(ev.target.id!=='file-in')return;const f=ev.target.files[0];if(!f)return;
 startFile(f.name,f.size,f.type.startsWith('video')||/\.(mp4|mov|webm|mkv|avi)$/i.test(f.name)?'video':'audio');
});
function tick(){clearInterval(S.pt);S.pt=setInterval(()=>{const p=S.player;if(!p||!p.playing||S.tab!=='best'||S.view){clearInterval(S.pt);return}const b=BEST.find(x=>x.id===p.id);p.pos=Math.min(b.sec,p.pos+1);if(p.pos>=b.sec)p.playing=false;render()},1000)}
render();
</script>
